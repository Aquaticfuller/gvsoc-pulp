# teranoc_spatz regression testset — VLSU burst transport + group MSHR +
# group barrier on the 256-core terapool_spatz4_fpu profile.
#
# Seven tests, all against prebuilt ELFs committed in bin/ (built from the
# local SW tree, config=terapool_spatz4_fpu; see
# scripts_local/build_all_shapes.sh at the workspace root):
#
#   sp_flw_latency     scalar single-load path through the MSHR
#                      (correctness: PASS + EOC 0)
#   vector_burst       VLSU burst transport end-to-end data check
#                      (correctness: EOC 0 — UART verdict compiled out)
#   mshr_burst         MSHR merge/burst functional stress
#                      (correctness: PASS + EOC 0)
#   gemm_128x128x512   GEMM anchor shape (A 16-way share): EOC 0 +
#                      cycles within +/-10% of 13,591
#   gemm_256x512x256   merge-ceiling shape (single 87.5% / burst 50.0%):
#                      EOC 0 + cycles within +/-10% of 37,242
#   gemm_512x512x128   balanced-share shape (A/B 4-way each):
#                      EOC 0 + cycles within +/-10% of 37,788
#
# Re-anchored 2026-08-19 after the ParityDrain return-channel fix (burst
# response beats alternate across the two response channels instead of all
# taking the request lane's channel). The previous references encoded the
# single-channel behaviour. Against the RTL goldens the fix moves
# 512x512x128 from +16.2% to -1.4%, 128x128x512 from +64.7% to +38.8% and
# leaves 256x512x256 at +7.0%: mean |error| 29.3% -> 15.7%.
#
# Cycle references measured 2026-08-15 on the CSR-flow build (post RTL
# sync: runtime CSR config, spill_req_in=0, remap 2, window/timeout 2047
# defaults). The GEMM ELFs program the MSHR through the bank-3 CSRs from
# their flavour configs; the tests only pass merge_reqs (elaboration-only
# in the RTL) and CFG_ENABLE_RESET=0 (RTL MshrCfgRuntime=1 reset state).
# The +/-10% window guards against silent breakage (stale generated-model
# .so, wiring regressions, merge-logic changes) while leaving room for
# intentional calibration changes — tighten the reference after each
# deliberate model change.
#
# Run (from gvsoc/, after `source sourceme.sh`; the 256-core tree takes
# 1-3 min to instantiate per test, the big GEMM ~5-8 min total):
#   gvtest --testset pulp/tests/teranoc_spatz/testset.cfg \
#          --max-timeout 1800 run table

from gvtest.testsuite import *

import os
import re

HERE = os.path.dirname(os.path.abspath(__file__))
BIN = os.path.join(HERE, 'bin')
WORK = os.environ.get('TERANOC_TEST_WORK_DIR', '/tmp/gvtest_teranoc_spatz')
# gvsoc/ root = pulp/tests/teranoc_spatz up three levels; makes the test
# independent of whether sourceme.sh was sourced.
GVSOC = os.path.normpath(os.path.join(HERE, '..', '..', '..'))

ENV_SETUP = (f'export PATH={GVSOC}/install/bin:$PATH; '
             f'export PYTHONPATH={GVSOC}/install/python:$PYTHONPATH; '
             f'export LD_LIBRARY_PATH={GVSOC}/third_party/DRAMSys:$LD_LIBRARY_PATH')

CYC_RX = re.compile(r'The execution took (\d+) cycles')
EOC_RX = re.compile(r'EOC register return value: (0x[0-9a-f]+)')


def _make_check_pass(pass_rx):
    """App self-check PASS line + EOC register 0x0."""
    def _check(test, output, *args, **kwargs):
        if re.search(pass_rx, output) is None:
            return False, 'no PASS line in output'
        m = EOC_RX.search(output)
        if m is None or m.group(1) != '0x0':
            return False, 'EOC %s' % (m.group(1) if m else 'line absent')
        return True, 'PASS + EOC 0x0'
    return _check


def _check_eoc_only(test, output, *args, **kwargs):
    """EOC 0x0 alone (vector-burst-test prints no UART verdict — the
    PASS detail is compiled out unless built with -DVERDICT_PRINTF)."""
    m = EOC_RX.search(output)
    if m is None or m.group(1) != '0x0':
        return False, 'EOC %s' % (m.group(1) if m else 'line absent')
    return True, 'EOC 0x0'


def _make_check_gemm(ref, tol_pct=10):
    """EOC 0x0 + 'The execution took N cycles' within +/-tol_pct of ref."""
    lo = int(ref * (100 - tol_pct) / 100)
    hi = int(ref * (100 + tol_pct) / 100 + 0.5)

    def _check(test, output, *args, **kwargs):
        m = EOC_RX.search(output)
        if m is None or m.group(1) != '0x0':
            return False, 'EOC %s' % (m.group(1) if m else 'line absent')
        c = CYC_RX.search(output)
        if c is None:
            return False, 'no cycle line in output'
        cyc = int(c.group(1))
        if not lo <= cyc <= hi:
            return False, (f'cycles={cyc} outside [{lo},{hi}] '
                           f'(ref {ref} +/-{tol_pct}%)')
        return True, f'cycles={cyc} (ref {ref} +/-{tol_pct}%)'
    return _check


def _add(testset, target, name, binary, checker, env=''):
    """One test = one gvrun of a committed ELF; stdout carries only the
    verdict lines (full log kept in the per-test work dir)."""
    t = testset.new_test(name)
    t.add_command(Shell(
        'run',
        f'mkdir -p {WORK} && '
        f'{ENV_SETUP}; {env} gvrun --target={target} '
        f'--work-dir {WORK}/{name} '
        f'--parameter binary={BIN}/{binary} run '
        f'> {WORK}/{name}.log 2>&1; '
        f'rc=$?; '
        f'grep -aE "execution took|EOC register|PASS|FAIL|RESULT|SPOT" '
        f'{WORK}/{name}.log; exit $rc'))
    t.add_command(Checker('check', checker))
    return t


def testset_build(testset):
    testset.set_name('teranoc_spatz')

    target = testset.get_target()
    if target is None or not target.get_name().startswith('teranoc_spatz'):
        return
    tname = target.get_name()

    # ---- correctness trio (default profile knobs) ----

    _add(testset, tname, 'sp_flw_latency', 'sp-flw-latency-test',
         _make_check_pass(r'RESULT .*check=PASS'),
         # A lone-load latency test: its probe pattern re-reads a line in
         # small groups, so hold_subs_single=4 (the new mk default) strands
         # every RESP_HOLD out to serve_timeout, and setup bursts ride
         # hold_window_burst. Pin the pre-2026-08-15 values so the test
         # stays quick (the shipping 2047s make it ~30 min for no extra
         # path coverage). SPILL_REQ_IN=1 keeps it in its validated regime
         # (the no-spill req_in path crawls on this traffic — see
         # group_mshr.py's spill_req_in note).
         env=('TERANOC_MSHR_SERVE_TIMEOUT=255 TERANOC_MSHR_HOLD_WINDOW_BURST=255 '
              'TERANOC_MSHR_HOLD_WINDOW_SINGLE=0 '
              'TERANOC_MSHR_HOLD_SUBS_SINGLE=2 TERANOC_MSHR_HOLD_SUBS_BURST=2 '
              'TERANOC_MSHR_SPILL_REQ_IN=1'))

    _add(testset, tname, 'vector_burst', 'vector-burst-test',
         _check_eoc_only)

    _add(testset, tname, 'mshr_burst', 'sp-mshr-burst-test',
         _make_check_pass(r'sp-mshr-burst-test: PASS'))

    # ---- GEMM performance anchors (CSR-flow ELFs: the kernel programs the
    # group MSHR through the bank-3 CSRs from its flavour config; only
    # merge_reqs — elaboration-only in the RTL — comes from the env, plus
    # CFG_ENABLE_RESET=0 so the warm-up bypasses the MSHR like the RTL's
    # MshrCfgRuntime=1 reset state) ----

    # 2026-08-19 (a): re-anchored 13591 -> 32100 when the ELF was rebuilt with
    # the synced flavour config (hold_subs_burst 2 -> 1) but the anchor was not
    # updated with it, so the suite checked a number the ELF could not produce.
    #
    # 2026-08-19 (b): re-anchored 32100 -> 11445 after the per-lane bypass queue
    # fix. The MSHR held ONE shared FIFO across all 32 response lanes and
    # aborted the drain on the first refusal. A 16-beat burst response all
    # targets one tile = one lane, so consecutive entries shared a lane and
    # beats for the other 31 lanes were stranded behind a busy one -- measured
    # denied == attempts EXACTLY, queue 652 deep, into a 32 word/cycle fabric.
    # One queue per lane with round-robin: 32100 -> 11445 against golden 9792,
    # i.e. +227.8% -> +16.9%. The other two anchors improved ~3% because the
    # STORE stream bypasses on every shape (91.7% of bypassed beats are writes;
    # a read coalescer cannot admit them), so all three are re-anchored to
    # current values and drift is measured from here.
    _add(testset, tname, 'gemm_128x128x512',
         'sp-fmatmul-opt-burst-merge-csr-128x128x512',
         _make_check_gemm(11445),
         env=('TERANOC_MSHR_MERGE_REQS=16 TERANOC_MSHR_CFG_ENABLE_RESET=0 '
              'TERANOC_MSHR_SPILL_REQ_IN=0'))

    _add(testset, tname, 'gemm_256x512x256',
         'sp-fmatmul-opt-burst-merge-csr-256x512x256',
         _make_check_gemm(35981),
         env=('TERANOC_MSHR_MERGE_REQS=8 TERANOC_MSHR_CFG_ENABLE_RESET=0 '
              'TERANOC_MSHR_SPILL_REQ_IN=0'))

    _add(testset, tname, 'gemm_512x512x128',
         'sp-fmatmul-opt-burst-merge-csr-512x512x128',
         _make_check_gemm(36621),
         env=('TERANOC_MSHR_MERGE_REQS=4 TERANOC_MSHR_CFG_ENABLE_RESET=0 '
              'TERANOC_MSHR_SPILL_REQ_IN=0'))

    # September 9: EOC alone accepted corrupt fp16 MSHR halfword replies.
    # These four groups' words are independently replayed from the pinned
    # ELF's A/B arrays by scripts_local/check_elf_spots.py and match RTL d1/d2.
    def check_fp16_spots(test, output, *args, **kwargs):
        expected = {
            0: (0, '316e46ca 4882391d c7c4c506 c4d4ca0d'),
            1: (32, '405ebf82 483b442a 3fda4561 be11c6fb'),
            2: (64, '42a5c63e 3e8ec5eb 30bd4940 c7d7c5e3'),
            3: (96, 'bcce49b6 c9f04522 4552c7d3 49a6481d'),
        }
        found = {}
        for m in re.finditer(r'\[SPOT\]\s+g=\s*(\d+)\s+row=\s*(\d+)\s+'
                             r'w0=(\w+)\s+w1=(\w+)\s+w2=(\w+)\s+w3=(\w+)', output):
            found[int(m[1])] = (int(m[2]), ' '.join(m.group(3,4,5,6)))
        ok, why = _check_eoc_only(test, output)
        return (ok and found == expected,
                'four ELF-derived samples match' if found == expected else 'fp16 SPOT mismatch')

    _add(testset, tname, 'gemm_fp16_mshr_subword', 'gemm-fp16-mshr-subword.elf',
         check_fp16_spots,
         env=('TERANOC_MSHR_MERGE_REQS=16 TERANOC_MSHR_CFG_ENABLE_RESET=0 '
              'TERANOC_VLSU_DISTRIBUTED_ROB=1'))
